  <style>
    :root{--ink:#162019;--muted:#657166;--paper:#f7f6f1;--card:#fffefa;--line:#e4e7df;--green:#136f4d;--soft:#eef5e9}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:860px;margin:auto;padding:30px 20px 140px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.12em}.back{display:inline-flex;margin:10px 0 18px;color:var(--green);font-weight:800;text-decoration:none}.doc{padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--card)}.doc h1{font-size:29px;line-height:1.3;margin:0 0 16px}.doc h2{margin:28px 0 10px;color:var(--green);font-size:22px}.doc h3{margin:22px 0 8px;font-size:18px}.doc p{margin:10px 0}.doc blockquote{margin:14px 0;padding:10px 14px;border-left:3px solid #9dcc6c;background:var(--soft);color:#45614f}.doc ul{margin:8px 0;padding-left:22px}.doc li{margin:5px 0}.doc a{color:var(--green);font-weight:700}.doc img{display:block;max-width:100%;height:auto;margin:16px auto;border-radius:12px}.doc table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}.doc th,.doc td{padding:8px;border:1px solid var(--line);text-align:left;vertical-align:top}.doc th{background:var(--soft)}.empty{padding:22px;border-radius:18px;background:var(--soft);color:#45614f}.bottom-nav{position:fixed;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px;min-height:66px;border:1px solid var(--line);border-radius:21px;background:rgba(255,254,250,.97);box-shadow:0 10px 32px rgba(25,45,30,.18);z-index:30}.bottom-nav a{display:grid;place-items:center;min-height:50px;padding:0 2px;border-radius:15px;color:var(--muted);font-size:16px;font-weight:700;line-height:1;text-decoration:none;white-space:nowrap}.bottom-nav a.active{background:var(--green);color:#fff}@media(max-width:620px){.wrap{padding:26px 16px 142px}.doc{padding:17px}.doc h1{font-size:25px}.doc h2{font-size:20px}.doc{font-size:15px}.bottom-nav{left:8px;right:8px;bottom:8px}.bottom-nav a{font-size:15px;padding:0 1px}}
  </style>
</head>
<body>
  <main class="wrap"><div class="eyebrow">CHEN YAO · KNOWLEDGE ARCHIVE</div><a class="back" href="archive.html" target="_top">← 返回更早</a><article class="doc" id="doc"><p>正在加载知识库原文…</p></article></main>
  <nav class="bottom-nav"><a href="./" target="_top">昨日</a><a class="active" href="archive.html" target="_top">更早</a><a href="design.html" target="_top">设计</a><a href="huaian.html" target="_top">淮安</a></nav>
  <script>
    const docs={
      '2026-05-market.md':'2026 年 5 月全国商业市场月报','2026-q3-pipeline.md':'2026 年 Q3 全国筹开商业项目盘点','2026-07-crr-week1.md':'CRR 商业地产一周要闻','2026-hangzhou-mixc.md':'杭州万象城运营分析','2026-07-first-store.md':'首店早知道一周要闻','2026-hefei-community.md':'在合肥，重新理解社区商业','2025-q1-outlook.md':'2025 年一季度商业风向','2025-pipeline.md':'2025 拟开业商业项目一览','2025-emotion-marketing.md':'年轻人情绪营销趋势观察','2023-h1-performance.md':'2023 上半年商业地产企业业绩','2024-shanghai-openings.md':'2024 年 4 月上海新开商业清单','2024-performance.md':'2024 商业地产企业全年业绩','2024-shanghai-spring.md':'2024 春节上海商业热力','2024-hk-capital.md':'2024 港资内地商业复盘','shanghai-mall-ranking.md':'上海商场人气排名','shanghai-tod.md':'上海轨交 TOD 商业热力','columbia-circle-map.md':'上生·新所园区地图解析','brand-first-store.md':'品牌首店与云贵菜品牌动态','cultural-tourism-aesthetic.md':'文旅商业审美研究'
    };
    const target=document.getElementById('doc'),key=new URLSearchParams(location.search).get('doc');
    const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const inline=s=>esc(s).replace(/!\[([^\]]*)\]\((https?:[^)]+)\)/g,'<img src="$2" alt="$1" loading="lazy">').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1 ↗</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    function render(md){let out='',list=false,rows=[];const flushList=()=>{if(list){out+='</ul>';list=false}},flushTable=()=>{if(rows.length){out+='<table>'+rows.map((r,i)=>'<tr>'+r.split('|').filter(Boolean).map(x=>(i===0?'<th>':'<td>')+inline(x.trim())+(i===0?'</th>':'</td>')).join('')+'</tr>').join('')+'</table>';rows=[]}};md.replace(/^---[\s\S]*?---\s*/,'').split('\n').forEach(line=>{if(/^\|/.test(line)&&/\|$/.test(line)){flushList();if(!/^\|?\s*[-:]+/.test(line))rows.push(line);return}flushTable();if(/^#\s+/.test(line)){flushList();out+='<h1>'+inline(line.replace(/^#\s+/,''))+'</h1>'}else if(/^##\s+/.test(line)){flushList();out+='<h2>'+inline(line.replace(/^##\s+/,''))+'</h2>'}else if(/^###\s+/.test(line)){flushList();out+='<h3>'+inline(line.replace(/^###\s+/,''))+'</h3>'}else if(/^>\s?/.test(line)){flushList();out+='<blockquote>'+inline(line.replace(/^>\s?/,''))+'</blockquote>'}else if(/^[-*]\s+/.test(line)){if(!list){out+='<ul>';list=true}out+='<li>'+inline(line.replace(/^[-*]\s+/,''))+'</li>'}else if(line.trim()){flushList();out+='<p>'+inline(line)+'</p>'}});flushList();flushTable();return out}
    if(!key||!docs[key]){target.innerHTML='<section class="empty"><h1>未找到原文</h1><p>请从“更早”页的知识库行业档案进入。</p></section>'}else{document.title='陈瑶的商业晨报｜'+docs[key];fetch('kb-originals/'+encodeURIComponent(key)).then(r=>r.ok?r.text():Promise.reject()).then(md=>target.innerHTML=render(md)).catch(()=>target.innerHTML='<section class="empty"><h1>原文暂时无法加载</h1><p>请返回档案页后重试。</p></section>')}
  </script>
</body>
