<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>陈瑶的商业晨报｜淮安大事</title><style>:root{--ink:#162019;--muted:#657166;--paper:#f7f6f1;--card:#fffefa;--line:#e4e7df;--green:#136f4d;--soft:#e9f4e9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#e2f1cb,transparent 25rem),var(--paper);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:860px;margin:auto;padding:32px 20px 140px}.eyebrow{font-size:12px;color:var(--green);letter-spacing:.1em}h1{font-size:40px;margin:8px 0;letter-spacing:-.08em;white-space:nowrap}h1 span{color:var(--green);margin-left:.15em}.sub,.card p{color:var(--muted)}.hero{margin:25px 0;padding:24px;border-radius:22px;background:var(--green);color:#fff}.hero strong{display:block;font-size:22px;line-height:1.45;margin-top:9px}.observe{margin:18px 0;padding:18px;border-radius:18px;background:var(--soft);color:#315443}.observe h2{margin:0 0 7px;color:var(--green);font-size:20px}.observe ul{margin:0;padding-left:18px}.observe li{margin:5px 0;font-size:13px}.filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:4px 0 12px}.filters button{min-height:50px;border:1px solid var(--line);border-radius:15px;padding:10px 14px;background:#fff;color:var(--muted);font:800 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei"}.filters button.active{background:var(--green);border-color:var(--green);color:#fff}.section-title{font-size:22px;margin:8px 0 12px;color:var(--green)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card{padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--card)}.card small{color:var(--green);font-weight:700}.card h3{font-size:17px;line-height:1.45;margin:7px 0}.card p{font-size:13px;margin:0}.card a{display:inline-block;color:var(--green);font-size:13px;font-weight:700;text-decoration:none;margin-top:9px}.note{margin:24px 0;padding:16px;border-radius:14px;background:var(--soft);color:var(--muted);font-size:13px}.bottom-nav{position:fixed;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:9px;border:1px solid var(--line);border-radius:22px;background:rgba(255,254,250,.97);box-shadow:0 10px 32px rgba(25,45,30,.18);backdrop-filter:blur(12px);z-index:10}.bottom-nav a{padding:14px 8px;border-radius:15px;text-align:center;text-decoration:none;color:var(--muted);font-size:16px;font-weight:600;white-space:nowrap}.bottom-nav a.active{background:var(--green);color:#fff;font-weight:700}@media(max-width:600px){.wrap{padding:30px 16px 132px}h1{font-size:34px}.grid{grid-template-columns:1fr}.bottom-nav{left:8px;right:8px;bottom:8px}.bottom-nav a{font-size:13px;padding:13px 2px}}.bottom-nav{left:10px;right:10px;bottom:10px;gap:6px;padding:7px;min-height:66px;border-radius:21px;z-index:30}.bottom-nav a{display:grid;place-items:center;min-height:50px;padding:0 2px;font-size:16px;line-height:1;white-space:nowrap;box-sizing:border-box}@media(max-width:620px){.bottom-nav{left:8px;right:8px;bottom:8px;min-height:66px}.bottom-nav a{min-height:50px;padding:0 1px;font-size:15px}}@media(max-width:620px){.wrap{padding:30px 16px 142px}.hero{margin:20px 0}.grid{grid-template-columns:1fr}.card{padding:17px}.section-title{margin-top:12px}}html,body{max-width:100%;overflow-x:hidden}.wrap{width:100%;overflow:hidden}.head,.hero,.portals,.observe,.filters,.grid{min-width:0}.hero strong,.portal span,.card h4,.card p,.observe li{overflow-wrap:anywhere}</style><link rel="stylesheet" href="assets/news-preview.css"></head><body><main class="wrap"><div class="eyebrow">HUAI'AN · LOCAL NEWS WATCH</div><h1>淮安<span>大事</span></h1><p class="sub">淮安大事 · 商业为主，同时关注影响消费、招商与客流的城市动态。</p><section class="hero">本地市场观察<strong>促消费活动、首发经济和重点商圈差异化运营，正在共同拉动淮安线下消费。</strong></section><section class="observe"><h2>淮安观察</h2><ul><li><b>消费券、票根与赛事第二现场正在形成组合。</b>重点是把一次性客流转化为跨店和复访行为。</li><li><b>商圈竞争要从同质促销转向差异化内容。</b>综合体、文旅与社区消费需要各自承担不同角色。</li></ul></section><nav class="filters" aria-label="淮安分类" id="filters"></nav><h2 class="section-title" id="category-title">商业资讯</h2><div class="grid" id="list"></div><div class="note">“商业资讯”为每日重点更新；“其他大事件”只保留会影响本地消费、招商、城市客流或产业环境的重要动态。</div></main><nav class="bottom-nav" aria-label="主导航"><a href="./" target="_top">昨日</a><a href="archive.html" target="_top">更早</a><a href="design.html" target="_top">设计</a><a class="active" href="huaian.html" target="_top">淮安</a></nav><script>const groups=[['商业资讯',[['消费数据｜A 级官方来源','1-5 月淮安社零增速居全省第一','全市社零 890.7 亿元，同比增长 4.0%；限上社零同比增长 7.3%。','https://www.huaian.gov.cn/col/14449_162851/art/o/17802432/1782458251555UuU7A2F9.html'],['商圈消费｜A 级官方来源','淮阴区“千万补贴”持续带动消费','汽车补贴、发票抽奖与重点商业载体共同培育消费习惯。','https://www.huaian.gov.cn/col/16656_366471/art/o/17828352/1785135414096RIkI4FND.html'],['文商旅｜A 级官方来源','暑期以“小票券”带动景区和城市消费','“悦享一夏”覆盖全市 19 个景区，并推出优惠联票。','https://www.huaian.gov.cn/col/16657_173466/art/17828352/1783661862267QnMrK5OP.html'],['商业战略｜A 级官方来源','消费载体“三新”行动推动综合体错位发展','万象城、万达、新亚、金鹰等被纳入差异化消费供给布局。','https://boc.huaian.gov.cn/col/13392_714273/art/o/17722944/17726791481447mx0tZrL.html'],['节日消费｜A 级官方来源','端午重点商贸企业销售近 1 亿元','22 家重点商贸企业销售额同比增长 11.2%，重点餐饮企业营收同比增长 6.6%。','https://www.huaian.gov.cn/col/14844_372384/art/17802432/1782199467560tbPszPfO.html'],['商业企划｜A 级官方来源','“苏超”第二现场带动商圈消费','万达、吾悦、中央新亚等通过观赛权益、票根和市集承接赛事客流。','https://www.huaian.gov.cn/col/14844_372384/art/17802432/1782199467560tbPszPfO.html']]],['其他大事件',[['经济运行｜A 级官方来源','市委财经委会议部署下半年经济工作','会议围绕经济运行分析，提出推动经济持续向前向上向好。','https://www.huaian.gov.cn/col/16654_124374/art/17828352/1784620077818XFOIPwhX.html'],['城市文旅｜A 级官方来源','“苏超”带动文商旅体融合消费','景区、古镇和商业综合体通过赛事直播、市集与消费券承接城市客流。','https://www.huaian.gov.cn/col/18094_788576/art/17749728/1777010122272kE5gBZb1.html']]]];let active='商业资讯';const filters=document.getElementById('filters'),list=document.getElementById('list');function render(){filters.innerHTML=groups.map(g=>'<button class="'+(g[0]===active?'active':'')+'" data-cat="'+g[0]+'">'+g[0]+' · '+g[1].length+'</button>').join('');const g=groups.find(x=>x[0]===active);document.getElementById('category-title').textContent=g[0];list.innerHTML=g[1].map(x=>'<article class="card"><small>'+x[0]+'</small><h3>'+x[1]+'</h3><p>'+x[2]+'</p><a href="'+x[3]+'">查看来源 ↗</a></article>').join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.cat;render()})}render();</script><script>(function(){if(location.search)history.replaceState(null,"",location.pathname);document.querySelectorAll(".bottom-nav a").forEach(function(a){a.addEventListener("click",function(){var u=new URL(a.href,location.href);u.searchParams.set("v",Date.now());a.href=u.pathname+u.search})})})()</script><script src="assets/news-preview.js"></script></body></html>
