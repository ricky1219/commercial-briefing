<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>陈瑶的商业晨报</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#f5f6f0}iframe{width:100%;height:100%;border:0;display:block}
  </style>
</head>
<body>
  <iframe id="briefing" title="陈瑶的商业晨报" src="about:blank"></iframe>
  <script>
    if(location.search) history.replaceState(null,'',location.pathname);
    document.getElementById('briefing').src='2026-07-30.html?refresh='+Date.now();
    async function forceRefresh(){
      try{
        localStorage.clear();
        sessionStorage.clear();
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(key=>caches.delete(key)));
        }
      }catch(e){}
      window.location.replace('./');
    }
  </script>
</body>
</html>
