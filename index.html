<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>淮万推广商业晨报</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#f5f6f0}iframe{width:100%;height:100%;border:0;display:block}.refresh{position:fixed;right:18px;top:18px;z-index:99;border:0;border-radius:99px;background:#116d4a;color:#fff;padding:11px 16px;font:700 14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 8px 20px rgba(17,109,74,.28)}.refresh:active{transform:scale(.97)}
  </style>
</head>
<body>
  <button class="refresh" type="button" onclick="forceRefresh()">↻ 强制刷新</button>
  <iframe id="briefing" title="淮万推广商业晨报" src="about:blank"></iframe>
  <script>
    document.getElementById('briefing').src='2026-07-30.html?refresh='+Date.now();
    async function forceRefresh(){
      try{
        localStorage.clear();
        sessionStorage.clear();
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(key=>caches.delete(key)));
        }
      }catch(e){}
      window.location.replace('./');
    }
  </script>
</body>
</html>
